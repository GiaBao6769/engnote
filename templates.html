<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Document</title>
</head>
<body>


<template id="DEF-SECTION-TEMP">

    <div class="def-section">

        <h2>Word</h2>
        <p class="label">Formal</p>
        
        <ul class="pronunciation-section">
            <li>UK: \hello\</li>
            <li>US: \hello\</li>
        </ul>

        <ul class="forms-section">
            <li>Words</li>
            <li>Wordent</li>
        </ul>
        <h3>(v/T)</h3>

        <div class="meaning">
            <p class="level"></p>
            <p class="content"></p>
            
            <div class="note-div">
                <p></p>
            </div>

            <hr>
        </div>


    </div>

</template>



<template id="EXAMPLES-SECTION-TEMP">
    <ul class="examples-section">
    </ul>
</template>

<template id="NAVBAR-TEMP">

    <nav id="NAVBAR">
        <a href="all_articles.html"><img src="images/logo.jpg"></a>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="all_articles.html">Articles</a></li>
            <li><a href="#">About</a></li>
        </ul>
        <button id="MODE-TOGGLE-BUTTON">
            <img id="SUN-ICON" class="mode-icon" src="SVG/sun.svg" alt="light">
            <img id="MOON-ICON" class="mode-icon hidden" src="SVG/moon.svg" alt="dark">
        </button>
    </nav>

</template>
    

<template id="FOOTER-TEMP">
    
    <footer id="FOOTER">
        THIS IS THE FOOTER
    </footer>

</template>


<template id ="ARTICLE-CARD-TEMP">

    <div class="article-card">
        <a href="article.html">
            <img class="article-thumbnail" src="images/no_thumbnail.png" alt="Card thumbnail">
                
            <div class="card-info">
                <h1 class="card-title">Superlative</h1>
                <p class="card-desc">A superlative is the form of an adjective or adverb that shows someone or something has the highest or lowest degree of a quality among three or more people or things.</p>
            </div>
        </a>
    </div>
    
</template>


</body>
</html>
